name: Frontend demo verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/web
    env:
      ARVESSA_TEST_PORT: 3037
      ARVESSA_TEST_START: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.agent-work/browsers
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:e2e
      - run: npx playwright install --with-deps firefox webkit
      - name: Firefox buyer and workspace workflows
        env:
          ARVESSA_E2E_ENGINE: firefox
        run: npm run test:e2e -- --grep 'buyer favorites persist|all nine demo roles|deposit → legal version|discovery filters'
      - name: WebKit buyer and workspace workflows
        env:
          ARVESSA_E2E_ENGINE: webkit
        run: npm run test:e2e -- --grep 'buyer favorites persist|all nine demo roles|deposit → legal version|discovery filters'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-evidence
          path: |
            .agent-work/e2e-results*.json
            .agent-work/playwright-report*
            .agent-work/test-results*
          include-hidden-files: true
          retention-days: 7
